name: Build WASM Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-fft-selection
            features: wasm
          - name: explicit-fft-simd
            features: wasm,wasm-simd
    env:
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-cargo-${{ hashFiles('**/Cargo.toml') }}
          cache-on-failure: true

      # https://rustwasm.github.io/wasm-pack/installer/
      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build wasm package
        working-directory: libDF
        run: RUSTFLAGS="-C target-feature=+simd128,+bulk-memory" wasm-pack build --no-opt --profile release-lto --target no-modules --features '${{ matrix.features }}'

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-package-${{ matrix.name }}
          path: ./libDF/pkg
          retention-days: 7
